services:
  - type: web
    name: sewasetu-portal-mcp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OFFICER_MCP_TOKEN
        value: officer-secret-key-purvanchal-2026
