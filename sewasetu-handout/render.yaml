services:
  - type: web
    name: sewasetu
    runtime: python
    plan: free
    rootDir: sewasetu-handout/app
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py; gunicorn --bind "0.0.0.0:$PORT" --workers 2 --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sewasetu-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: sewasetu@123
      - key: APP_SMS_GATEWAY_URL
        value: http://localhost:8025
      - key: PENSION_SCHEME_DEADLINE
        value: "2027-10-31 23:59"
      - key: PENSION_MIN_AGE
        value: "60"
      - key: PENSION_SLA_DAYS
        value: "15"
      - key: APP_OTP_VALIDITY_SECONDS
        value: "300"
      - key: APP_UPLOAD_DIR
        value: /var/sewasetu/uploads

databases:
  - name: sewasetu-db
    plan: free
    databaseName: sewasetu
    user: sewasetu
